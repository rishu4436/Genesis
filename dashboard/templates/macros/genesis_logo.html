{# Genesis logo — literal letter G (Outfit Black), BNB gold badge #}
{% macro render(size=48, uid='gen') %}
<svg class="genesis-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="{{ size }}" height="{{ size }}" fill="none" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="{{ uid }}-bg" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a160e"/>
      <stop offset="100%" stop-color="#060508"/>
    </linearGradient>
    <linearGradient id="{{ uid }}-gold" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF6C8"/>
      <stop offset="55%" stop-color="#FCD535"/>
      <stop offset="100%" stop-color="#C9920A"/>
    </linearGradient>
    <filter id="{{ uid }}-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FCD535" flood-opacity="0.4"/>
    </filter>
    <clipPath id="{{ uid }}-clip">
      <rect width="48" height="48" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#{{ uid }}-clip)">
    <rect width="48" height="48" rx="13" fill="url(#{{ uid }}-bg)"/>
    <rect x="1" y="1" width="46" height="46" rx="12" stroke="url(#{{ uid }}-gold)" stroke-width="1.25" fill="none" opacity="0.65"/>

    <text
      x="24"
      y="24.5"
      text-anchor="middle"
      dominant-baseline="central"
      class="genesis-logo-letter"
      font-family="'Outfit', 'Arial Black', 'Helvetica Neue', sans-serif"
      font-weight="900"
      font-size="30"
      fill="url(#{{ uid }}-gold)"
      filter="url(#{{ uid }}-glow)">G</text>
  </g>
</svg>
{% endmacro %}
